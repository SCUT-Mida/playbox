<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#141a22" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23d4a84b'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' fill='%23fff' font-family='serif' font-weight='bold'%3E富%3C/text%3E%3C/svg%3E" />
  <title>大富翁 · 环游之城</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #141a22;
      overflow: hidden;
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: stretch;
      justify-content: center;
    }

    /* 舞台宽度：窄屏填满视口；宽屏（桌面预览）按主框架 720:1280 竖屏画幅收窄居中。
       若不约束，行向 flex 会让舞台收缩成内容宽（棋盘为绝对定位不参与测量），
       整局界面被挤成窄条。 */
    #game-container>* {
      width: min(100%, calc(100vh * 720 / 1280));
    }
  </style>
</head>

<body>
  <div id="game-container"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
